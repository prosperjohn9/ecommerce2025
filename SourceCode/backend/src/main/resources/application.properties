# === Local .env file (gitignored; copy .env.example to .env) ===
# Real environment variables take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# === PostgreSQL Config ===
# Required. No defaults: the app will not start until these are set.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema and seed data come from Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Spring's own schema.sql/data.sql runner stays off so only Flyway touches the schema.
spring.sql.init.mode=never

# Server port
server.port=8080

# SQL logging is off by default. The dev profile (application-dev.properties)
# turns on statement logging only. Never enable org.hibernate.orm.jdbc.bind:
# it logs bound parameter values such as emails, password hashes and addresses.
spring.jpa.show-sql=false
