# === Local .env file (gitignored; copy .env.example to .env) ===
# Real environment variables take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# === PostgreSQL Config ===
# Required. No defaults: the app will not start until these are set.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# === CORS ===
# Required. Browser origin(s) of the React app, comma-separated.
app.cors.allowed-origins=${FRONTEND_ORIGIN}

# Schema and seed data come from Flyway (src/main/resources/db/migration).
# Hibernate only checks that the entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Spring's own schema.sql/data.sql runner stays off so only Flyway touches the schema.
spring.sql.init.mode=never

# Server port
server.port=8080

# === Strict JSON input ===
# Reject fields the API does not define (e.g. a client-sent "price", "total" or "userId")
# and fractional numbers where a whole number is expected (quantity 1.5).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# === Session cookie ===
# The session lives on the server; the browser only holds this cookie.
server.servlet.session.cookie.http-only=true
# Secure by default. Set COOKIE_SECURE=false only for local HTTP in a browser
# that refuses Secure cookies on http://localhost.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# Never put the session id in URLs.
server.servlet.session.tracking-modes=cookie

# SQL logging is off by default. The dev profile (application-dev.properties)
# turns on statement logging only. Never enable org.hibernate.orm.jdbc.bind:
# it logs bound parameter values such as emails, password hashes and addresses.
spring.jpa.show-sql=false
